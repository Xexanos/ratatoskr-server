openapi: 3.0.3
info:
  title: Ratatoskr API
  version: 2.0.0
  description: |
    Ratatoskr bridges an Audiobookshelf (ABS) server and Sonos speakers. This
    document describes the HTTP API that Ratatoskr's own clients (the Android app,
    and any future client) use to browse the library, pick a speaker, and control
    playback. Audio itself is streamed directly from Audiobookshelf to the Sonos
    speakers and does not pass through this API.

    This contract is the single source of truth for client/server communication.
    Server and clients are versioned and released independently, and must remain
    compatible across a range of versions. Therefore:

      - The API is versioned in the URL path, kept in one place (servers.url).
        Breaking changes go into a new major version and a new path, served alongside
        the old one during a transition window.
      - Backwards-compatible additions (new optional fields, new endpoints) are minor
        version bumps within the current major. Clients must ignore unknown fields.
      - A CI check (oasdiff) fails any change that breaks compatibility without a
        major version bump.

    This document is the /v2 surface: Ratatoskr-native sessions, where the server is the
    sole holder of Audiobookshelf tokens and the client holds one opaque Ratatoskr token
    (ADR-0001). Its predecessor /v1 — a shared Audiobookshelf token pair with a
    refresh-token handover protocol — is served in parallel until its sunset and is
    specified by the frozen contract 1.4.0 git tag, not by this file.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://{host}:{port}/v2
    description: Ratatoskr service on the local network
    variables:
      host:
        default: localhost
      port:
        default: "8080"

security:
  - bearerAuth: []

tags:
  - name: system
  - name: speakers
  - name: library
  - name: playback

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency check
      security: []
      tags: [system]
      responses:
        "200":
          description: Service is up. Reports reachability of its dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with Audiobookshelf credentials and receive a Ratatoskr token
      description: |
        Ratatoskr validates the credentials against Audiobookshelf, opens its own private
        Audiobookshelf session for this device login, and returns an opaque Ratatoskr token
        plus the identified user. Clients send that token as the bearer token on all other
        endpoints. The password is stored nowhere, and Audiobookshelf tokens never reach the
        client — Ratatoskr is their sole holder, so the library view and progress stay
        per-user without the client ever holding an upstream credential.

        Each sign-in creates an independent session with its own token: signing in on one
        device never signs another out, and each device is revoked on its own.
      security: []
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this device
      description: |
        Invalidates the bearer token immediately and releases the Audiobookshelf session
        Ratatoskr held for this device; other devices and other Audiobookshelf clients keep
        theirs.

        Idempotent and best-effort, so a client can always complete a sign-out locally: an
        unknown or already-invalidated token and an unreachable Audiobookshelf both still
        answer 204. Only a missing or malformed Authorization header is a 401.
      tags: [system]
      responses:
        "204":
          description: Signed out. The token is no longer valid.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /speakers:
    get:
      operationId: listSpeakers
      summary: List discovered Sonos speakers and groups
      # Deliberately unauthenticated (SPEC section 8): discovery is local-only and any LAN
      # device can already enumerate the Sonos topology directly via SSDP/UPnP, so requiring
      # a token here gates nothing. The speaker id is only usable through the authenticated
      # playback endpoints.
      security: []
      tags: [speakers]
      responses:
        "200":
          description: The speakers currently visible on the local network.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Speaker"
        "502": { $ref: "#/components/responses/UpstreamError" }

  /library/items:
    get:
      operationId: listLibraryItems
      summary: List or search audiobooks from Audiobookshelf
      description: |
        A thin, paginated projection of the ABS library so that clients never need
        Audiobookshelf credentials of their own. Only the fields required to choose
        and display a book are returned.
      tags: [library]
      parameters:
        - name: q
          in: query
          description: Optional full-text search over title and author.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
      responses:
        "200":
          description: A page of library items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItemPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /library/items/{itemId}:
    get:
      operationId: getLibraryItem
      summary: Get a single audiobook, including stored progress
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: The requested item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /library/items/{itemId}/cover:
    get:
      operationId: getLibraryItemCover
      summary: Cover image for an item, proxied from Audiobookshelf
      description: |
        Returns the item's cover image. Ratatoskr fetches it from Audiobookshelf
        server-side with its own credentials and serves it under this API's auth, so
        clients never need Audiobookshelf credentials or direct network access to it.
        This is what `LibraryItemSummary.coverUrl` points at.

        Optionally scaled: pass `h` to get a variant no taller than that many pixels.
        Clients set `h` from the target row height times the device pixel density, so
        low-density screens request fewer pixels. Covers are portrait, so scaling is by
        height (the fixed list-row dimension); width follows the aspect ratio. Omitting
        `h` returns the full-size cover (used on the now-playing screen). The server MAY
        clamp `h` to a small set of sizes and cache the result, and MAY delegate the
        scaling upstream to Audiobookshelf's own cover resizing.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: h
          in: query
          required: false
          description: Target maximum height in pixels for a scaled variant. Omit for full size.
          schema: { type: integer, minimum: 1, maximum: 2048 }
      responses:
        "200":
          description: The cover image bytes.
          content:
            image/*:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /library/in-progress:
    get:
      operationId: listInProgressItems
      summary: Books currently in progress, most-recently-listened first
      description: |
        A shelf of the books the user has started but not finished (progress present,
        position > 0, not finished), ordered most-recently-listened first. Bounded by `limit`
        and NOT paginated: books beyond the limit are not lost — they remain in the main
        `GET /library/items` list, where their `progress` marks them as in progress. Returns a
        LibraryItemList (no cursor) because the shelf is a complete, bounded set, not a page.
      tags: [library]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of items on the shelf.
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: The in-progress shelf.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItemList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Get the active playback session
      description: |
        Ratatoskr plays one audiobook at a time. Returns 404 when nothing is playing.
      tags: [playback]
      responses:
        "200":
          description: The active session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoActiveSession" }
    put:
      operationId: startSession
      summary: Start (or replace) playback on a speaker
      description: |
        Starts playback of an item on a speaker. If a session is already active it
        is stopped first, and its final position is written back to Audiobookshelf.
        Playback resumes from the position stored in Audiobookshelf. This operation
        is idempotent for the same itemId and speakerId.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartSessionRequest" }
      responses:
        "200":
          description: Session started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: stopSession
      summary: Stop playback
      description: |
        Stops playback and writes the final position back to Audiobookshelf.
      tags: [playback]
      responses:
        "204":
          description: Stopped. No active session remains.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoActiveSession" }

  /sessions/current/pause:
    post:
      operationId: pauseSession
      summary: Pause playback
      tags: [playback]
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoActiveSession" }

  /sessions/current/resume:
    post:
      operationId: resumeSession
      summary: Resume playback
      tags: [playback]
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoActiveSession" }

  /sessions/current/seek:
    post:
      operationId: seekSession
      summary: Seek to an absolute position
      description: |
        The position is the absolute offset in seconds from the start of the whole
        audiobook. Ratatoskr maps it to the correct track and in-track offset.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeekRequest" }
      responses:
        "200":
          description: Seek accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NoActiveSession" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The caller's Ratatoskr token, obtained from POST /auth/login. It is opaque, does not
        expire and is never rotated: a client stores it once and sends it unchanged until
        POST /auth/logout. Ratatoskr resolves it to the Audiobookshelf session it holds for
        this device, so the library view and progress stay scoped to the user who signed in.
        Required on every endpoint except /health, /auth/login, and GET /speakers.

  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      description: Audiobookshelf library item id.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        The request carried no usable credential. The body's `code` separates the two cases a
        client must handle differently — see UnauthorizedError.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UnauthorizedError" }
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoActiveSession:
      description: No audiobook is currently playing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: A dependency (Audiobookshelf or the Sonos controller) failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        Too many credential attempts from this client address. The limit is per source address and
        conservative enough that a person mistyping a password will not reach it; a client that does
        should wait and retry rather than treat it as a rejected credential. `Retry-After` gives the
        seconds until the window resets.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, abs, sonos]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Server semver.
        abs:
          $ref: "#/components/schemas/DependencyStatus"
        sonos:
          $ref: "#/components/schemas/DependencyStatus"

    DependencyStatus:
      type: object
      required: [reachable]
      properties:
        reachable: { type: boolean }
        detail: { type: string }

    Speaker:
      type: object
      required: [id, name, isGroup]
      properties:
        id:
          type: string
          description: Stable identifier used in start requests.
        name: { type: string }
        isGroup: { type: boolean }
        members:
          type: array
          description: Room names in the group, when isGroup is true.
          items: { type: string }

    Progress:
      type: object
      required: [positionSeconds, isFinished]
      properties:
        positionSeconds:
          type: number
          format: double
          minimum: 0
        isFinished: { type: boolean }

    LibraryItemSummary:
      type: object
      required: [id, title, durationSeconds]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        durationSeconds:
          type: number
          format: double
          minimum: 0
        coverUrl:
          type: string
          nullable: true
          description: >-
            Path to the item's cover image on this API (the cover-proxy route, e.g.
            /v2/library/items/{id}/cover), relative to the server origin the client is already
            talking to; requires the bearer token. Null when no cover is available.
        progress:
          $ref: "#/components/schemas/Progress"

    LibraryItem:
      allOf:
        - $ref: "#/components/schemas/LibraryItemSummary"
        - type: object
          properties:
            description: { type: string }
            narrator: { type: string }

    LibraryItemList:
      # Base shape for any "set of library items" response (browse list, shelves). Holds only
      # the always-present part; paginated responses add a cursor on top (LibraryItemPage).
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryItemSummary" }

    LibraryItemPage:
      # A paginated LibraryItemList: the base plus a forward cursor.
      allOf:
        - $ref: "#/components/schemas/LibraryItemList"
        - type: object
          properties:
            nextCursor:
              type: string
              nullable: true
              description: Present when more items are available.

    PlaybackState:
      type: string
      enum: [playing, paused, buffering, stopped, finished]

    Session:
      type: object
      required: [itemId, speakerId, state, positionSeconds, durationSeconds, updatedAt]
      properties:
        itemId: { type: string }
        item: { $ref: "#/components/schemas/LibraryItemSummary" }
        speakerId: { type: string }
        state: { $ref: "#/components/schemas/PlaybackState" }
        positionSeconds:
          type: number
          format: double
          minimum: 0
          description: Absolute offset from the start of the whole audiobook.
        durationSeconds:
          type: number
          format: double
          minimum: 0
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }

    AuthSession:
      type: object
      required: [token, user]
      description: |
        A signed-in device as its client sees it: the credential to send, plus the
        Audiobookshelf identity it was issued for. Unrelated to the playback Session — this
        one is about who the caller is, that one about what is playing where.
      properties:
        token:
          type: string
          description: |
            The opaque Ratatoskr token; send it as the bearer token on every other endpoint.
            It carries no readable structure and no expiry to inspect — treat it as a string
            to store and replay. It stays valid until POST /auth/logout, across server
            restarts and arbitrarily long pauses, so a client never has to re-authenticate
            on its own initiative. Never logged (server SPEC section 14).
        user: { $ref: "#/components/schemas/User" }

    StartSessionRequest:
      type: object
      required: [itemId, speakerId]
      properties:
        itemId: { type: string }
        speakerId: { type: string }

    SeekRequest:
      type: object
      required: [positionSeconds]
      properties:
        positionSeconds:
          type: number
          format: double
          minimum: 0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.

    UnauthorizedError:
      # The 401 body, narrowed to the codes a client branches on: the two failures look alike
      # on the wire but call for opposite reactions, so the distinction has to be machine-
      # readable rather than left to the message (server SPEC section 8).
      # UPSTREAM_SESSION_LOST is spelled as ADR-0001 and SPEC section 8 spell it; the
      # lowercase codes predate that convention and stay as they are within this major.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [unauthorized, UPSTREAM_SESSION_LOST]
              description: |
                `unauthorized` — no token, or one this server does not know (it was never
                issued, or sign-out revoked it): the device is signed out, and the client
                asks for credentials as a fresh sign-in.

                `UPSTREAM_SESSION_LOST` — the token is valid, but the Audiobookshelf session
                Ratatoskr held for it has died (server↔Audiobookshelf contact lost for longer
                than Audiobookshelf's refresh window, or the username changed). Only the
                password can restore it: the client shows a targeted re-authentication prompt
                and keeps the rest of its state. Re-authenticating yields a new token.
