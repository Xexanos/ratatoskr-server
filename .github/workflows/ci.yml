name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - run: pnpm -r run build
      # `build` compiles src; this covers what it cannot — the test sources, which vitest only
      # transpiles, so nothing else would ever typecheck them. Runs after build because it resolves
      # the workspace packages through their built declarations, exactly as the app does.
      - run: pnpm run typecheck
      - run: pnpm -r run test:coverage
      - run: pnpm run lint
      # The fake-Sonos image build is validated (and published) by fake-sonos.yml, which is
      # path-filtered to packages/fake-sonos/** so it only runs when the fake actually changes.

  # Live-ABS integration matrix: the pinned minimum supported version, plus the moving
  # :latest tag as a deliberate drift canary so a new ABS release that breaks us turns CI
  # red instead of surfacing in production. Both legs are blocking. fail-fast is off so a
  # latest-drift failure still shows the (usually green) pinned leg for contrast.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # This workflow is the single source of truth for the supported-minimum ABS digest
          # (no test code pins it — globalSetup uses ABS_IT_IMAGE or the current default). Bump
          # here when the minimum supported version changes.
          - name: abs-2.26.0-min
            image: ghcr.io/advplyr/audiobookshelf@sha256:16685fbba37a21d403f5390b907d286e15b3086d26527269b4ad785f71f571e5
          # Intentionally UNPINNED: this leg exists to catch upstream drift early.
          - name: abs-latest
            image: ghcr.io/advplyr/audiobookshelf:latest
    name: integration (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      # The integration tests spawn the compiled server (packages/app/dist/main.js) and talk
      # to it over real HTTP, so they need the build first.
      - run: pnpm -r run build
      - run: pnpm -r --if-present run test:integration
        env:
          ABS_IT_IMAGE: ${{ matrix.image }}

  # Commit types are load-bearing: promote.yml derives the release version from them at
  # promotion (see CLAUDE.md / docs/deploy.md). Lint every commit on the PR — PRs are
  # merge-committed, so the individual commits (not the PR title) are what the versioning
  # later reads. Rules live in commitlint.config.mjs at the repo root; commitlint runs via
  # npx with pinned versions rather than as a devDependency so the workspace install stays
  # lean and this job needs no pnpm setup. The config's `extends` resolves from the shared
  # npx prefix where both -p packages land (verified: the job lints on a fresh runner with
  # no repo node_modules).
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's commits must be present locally to lint the base..head range.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Lint the PR's commit messages
        run: |
          npx --yes -p @commitlint/cli@21.2.1 -p @commitlint/config-conventional@21.2.0 \
            commitlint --from ${{ github.event.pull_request.base.sha }} \
                       --to ${{ github.event.pull_request.head.sha }} --verbose

  # SPEC section 6: contract/openapi.yaml is the single source of truth and must not
  # change in a breaking way within /v1 without a major version bump.
  oasdiff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --depth=1 origin ${{ github.base_ref }}
      - uses: oasdiff/oasdiff-action/breaking@4bdf89062dad92caea71236f59704b04d3ce9682 # v0.1.8
        with:
          base: "origin/${{ github.base_ref }}:contract/openapi.yaml"
          revision: "HEAD:contract/openapi.yaml"
          # Resolve allOf before diffing so composition (e.g. LibraryItemPage = allOf[LibraryItemList,
          # {nextCursor}]) is compared by its effective schema, not its unresolved wrapper. Without
          # this, refactoring a flat schema into an equivalent allOf reads as a false-positive break.
          flatten-allof: true
          fail-on: WARN
          github-token: ${{ github.token }}

  # SPEC section 6: each contract version is frozen under an immutable contract-<x.y.z> git tag the
  # moment it lands on main (contract-tag.yml). For those tags to stay honest — the app generates its
  # client types from one, and a superseded major is served frozen against one — a version must name
  # exactly one contract text. So any change to contract/openapi.yaml must move info.version strictly
  # forward, to a version that has never been tagged. oasdiff (above) governs the *shape* of a change
  # (no break without a major bump); this governs its *identity* (a changed contract is a new, higher,
  # not-yet-taken version). Runs on every PR, unfiltered, so it is safe as a required status check: an
  # unchanged contract passes in the first step rather than leaving the check forever pending.
  contract-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --depth=1 origin ${{ github.base_ref }}
      - name: A changed contract must bump info.version to a new, higher, untagged version
        run: |
          set -euo pipefail
          # Read the top-level info.version. No `exit` in the awk: an early exit closes the pipe while
          # `git show` is still writing, and under pipefail the SIGPIPE would fail the command
          # substitution. The `inside` guard already limits it to the one version under info:.
          read_version() {
            git show "$1:contract/openapi.yaml" |
              awk '/^info:/ { inside = 1; next } /^[^[:space:]]/ { inside = 0 } inside && $1 == "version:" { print $2 }'
          }

          base_ref="origin/${{ github.base_ref }}"
          if [ "$(git rev-parse "$base_ref:contract/openapi.yaml")" = "$(git rev-parse HEAD:contract/openapi.yaml)" ]; then
            echo "contract/openapi.yaml unchanged — nothing to check."
            exit 0
          fi

          base=$(read_version "$base_ref")
          head=$(read_version HEAD)
          echo "contract/openapi.yaml changed: info.version ${base:-<none>} -> ${head:-<none>}"

          if ! printf '%s' "$head" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=contract/openapi.yaml::info.version '$head' is not a plain x.y.z semver"
            exit 1
          fi
          # Strictly greater than base: unequal, and the higher of the two under version sort.
          if [ "$head" = "$base" ] || [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n1)" != "$head" ]; then
            echo "::error file=contract/openapi.yaml::a changed contract must bump info.version forward ($base -> $head is not an increase)"
            exit 1
          fi
          # The tag is cut once and never moved; a version may not be reused for a second contract text.
          if git ls-remote --exit-code --tags origin "refs/tags/contract-$head" >/dev/null 2>&1; then
            echo "::error file=contract/openapi.yaml::contract-$head is already tagged and immutable — bump to a version that has not been released"
            exit 1
          fi
          echo "OK: $head is a forward bump and contract-$head is not yet taken."
